# Render blueprint: one web service and one free PostgreSQL database.
databases:
  - name: pdm-tracker-db
    plan: free
    databaseName: pdm_tracker

services:
  - type: web
    name: pdm-tracking-system
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: pdm-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,pdm.treez.tech"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: USSD_CALLBACK_TOKEN
        generateValue: true
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://pdm.treez.tech"
