<svg class="hero-art" viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A parish with homes, gardens, a SACCO office and rising savings">
  <circle cx="455" cy="70" r="34" fill="#f2b705"/>
  <circle cx="455" cy="70" r="52" fill="#f2b705" opacity=".18"/>
  <path d="M0 210 C 90 160, 170 175, 250 195 S 420 150, 560 185 L560 300 L0 300 Z" fill="#1f8a5b" opacity=".55"/>
  <path d="M0 240 C 120 205, 220 220, 330 235 S 480 215, 560 228 L560 300 L0 300 Z" fill="#1f8a5b"/>
  <path d="M250 300 C 270 260, 300 245, 345 236" stroke="#f6d77a" stroke-width="10" fill="none" stroke-linecap="round" opacity=".8"/>
  <!-- homes -->
  <g transform="translate(70 200)"><rect width="46" height="30" fill="#f4e7c8"/><path d="M-6 2 L23 -20 L52 2 Z" fill="#8a5a2b"/><rect x="18" y="12" width="10" height="18" fill="#8a5a2b"/></g>
  <g transform="translate(150 212)"><rect width="36" height="24" fill="#f4e7c8"/><path d="M-5 2 L18 -16 L41 2 Z" fill="#a36a33"/><rect x="14" y="10" width="8" height="14" fill="#8a5a2b"/></g>
  <!-- SACCO office -->
  <g transform="translate(360 186)"><rect width="78" height="44" rx="3" fill="#ffffff"/><rect x="-4" y="-8" width="86" height="10" rx="2" fill="#0b2e6b"/><rect x="10" y="10" width="14" height="14" fill="#cfe0fb"/><rect x="54" y="10" width="14" height="14" fill="#cfe0fb"/><rect x="31" y="20" width="16" height="24" fill="#0b2e6b"/><text x="39" y="-1" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#f2b705">SACCO</text></g>
  <!-- banana plants -->
  <g fill="#2e9a6a"><path d="M230 230 c-2 -30 -18 -40 -30 -42 14 10 20 22 26 42z"/><path d="M232 230 c4 -32 20 -38 32 -38 -14 8 -22 20 -28 38z"/><rect x="229" y="212" width="5" height="22" fill="#6b4a2a"/></g>
  <g fill="#2e9a6a" transform="translate(300 8)"><path d="M230 230 c-2 -30 -18 -40 -30 -42 14 10 20 22 26 42z"/><path d="M232 230 c4 -32 20 -38 32 -38 -14 8 -22 20 -28 38z"/><rect x="229" y="212" width="5" height="22" fill="#6b4a2a"/></g>
  <!-- rising bars: savings and income -->
  <g transform="translate(40 40)">
    <rect x="0" y="70" width="18" height="40" rx="4" fill="#f2b705" opacity=".5"/>
    <rect x="28" y="48" width="18" height="62" rx="4" fill="#f2b705" opacity=".75"/>
    <rect x="56" y="22" width="18" height="88" rx="4" fill="#f2b705"/>
    <path d="M4 62 L37 40 L65 14" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="14" r="5" fill="#ffffff"/>
  </g>
</svg>
