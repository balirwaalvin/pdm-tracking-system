{% with s=loan.status %}<span class="badge {% if s == 'approved' or s == 'disbursed' or s == 'repaying' %}text-bg-primary{% elif s == 'closed' %}text-bg-success{% elif s == 'rejected' or s == 'defaulted' %}text-bg-danger{% elif s == 'appraised' %}text-bg-info{% elif s == 'submitted' %}text-bg-warning{% else %}text-bg-secondary{% endif %}">{{ loan.get_status_display }}</span>{% endwith %}
