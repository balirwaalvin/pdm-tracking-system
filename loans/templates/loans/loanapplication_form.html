{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}New loan application · PDM Tracking System{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
  <h1 class="h3 mb-3">New loan application</h1>
  <div class="card shadow-sm"><div class="card-body">
    <form method="post" novalidate>{% csrf_token %}{{ form|crispy }}
      <div class="d-flex gap-2"><button class="btn btn-pdm">Save draft</button><a class="btn btn-outline-secondary" href="{% url 'loans:loan_list' %}">Cancel</a></div>
    </form>
  </div></div>
</div></div>
{% endblock %}
