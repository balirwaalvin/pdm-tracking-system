{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Register an enterprise group · PDM Tracking System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">Register an enterprise group</h1>
    <div class="card shadow-sm"><div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-pdm">Save</button>
          <a class="btn btn-outline-secondary" href="{% url 'registry:group_list' %}">Cancel</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
