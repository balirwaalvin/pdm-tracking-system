{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Record a release · PDM Tracking System{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="h3 mb-1">Record a fund release</h1>
  <p class="text-muted">To {{ sacco.name }}, {{ sacco.parish.name }} parish</p>
  <div class="card shadow-sm"><div class="card-body">
    <form method="post" novalidate>{% csrf_token %}{{ form|crispy }}
      <div class="d-flex gap-2"><button class="btn btn-pdm">Save</button><a class="btn btn-outline-secondary" href="{% url 'saccos:sacco_detail' sacco.pk %}">Cancel</a></div>
    </form>
  </div></div>
</div></div>
{% endblock %}
